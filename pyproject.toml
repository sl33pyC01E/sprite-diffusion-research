[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spritelab"
version = "0.1.0"
description = "Indexed sprite acquisition and animated-sprite generation research"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.28",
  "numpy>=2.0",
  "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]
analysis = [
  "duckdb>=1.2",
  "imagehash>=4.3",
  "opencv-python-headless>=4.11",
]
ml = [
  "accelerate>=1.3",
  "diffusers>=0.32",
  "safetensors>=0.5",
  "transformers>=4.48",
]

[project.scripts]
spritelab = "spritelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
